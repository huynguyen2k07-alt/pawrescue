{% load static %}
<aside
    class="support-chat"
    id="support-chat"
    data-state-url="{% url 'support:chat-state' %}"
    data-send-url="{% url 'support:chat-send' %}"
>
    <button
        class="support-chat-toggle"
        id="support-chat-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="support-chat-panel"
    >
        <span class="support-chat-toggle-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M20 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="support-chat-toggle-copy"><strong>Chat với PawRescue</strong><small>Quản trị viên hỗ trợ</small></span>
        <span class="support-chat-badge" data-support-badge {% if not support_chat_unread_count %}hidden{% endif %}>{{ support_chat_unread_count }}</span>
    </button>

    <section class="support-chat-panel" id="support-chat-panel" aria-label="Chat hỗ trợ PawRescue" hidden>
        <header>
            <div class="support-agent-avatar" aria-hidden="true">P</div>
            <div><strong>Hỗ trợ PawRescue</strong><span><i></i><span data-support-status>Sẵn sàng hỗ trợ</span></span></div>
            <button type="button" data-support-close aria-label="Đóng cửa sổ chat">×</button>
        </header>
        <div class="support-chat-messages" data-support-messages aria-live="polite">
            <div class="support-chat-loading"><span></span><span></span><span></span></div>
        </div>
        <p class="support-chat-feedback" data-support-feedback hidden></p>
        <form class="support-chat-form" data-support-form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="support-chat-attachment-preview" data-support-attachment-preview hidden></div>
            <div class="support-chat-compose">
                <input
                    class="support-file-input"
                    id="support-chat-attachments"
                    name="attachments"
                    type="file"
                    accept=".jpg,.jpeg,.png,.webp,.gif,.mp4,.webm,.mov"
                    multiple
                    data-support-file-input
                >
                <label class="support-attach-button" for="support-chat-attachments" aria-label="Thêm ảnh hoặc video" title="Thêm ảnh hoặc video">
                    <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="m20.5 11.5-8.4 8.4a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </label>
                <label class="sr-only" for="support-chat-body">Nội dung cần hỗ trợ</label>
                <textarea id="support-chat-body" name="body" rows="2" maxlength="2000" placeholder="Nhập tin nhắn hoặc gửi ảnh/video..."></textarea>
                <button type="submit" aria-label="Gửi tin nhắn"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4zM22 2 11 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
        </form>
        <small class="support-chat-privacy">Tối đa 4 tệp · Ảnh 8 MB · Video 40 MB · Chỉ quản trị viên có quyền mới xem.</small>
    </section>
</aside>
